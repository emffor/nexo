services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    image: nexo-app
    container_name: nexo-app
    restart: unless-stopped
    init: true

    environment:
      DATABASE_URL: ${DATABASE_URL:?Defina DATABASE_URL no arquivo .env}
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}

    ports:
      - "127.0.0.1:${APP_PORT:-3001}:3000"

    networks:
      - nexo-network

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  postgres:
    image: postgres:16-alpine
    container_name: nexo-postgres
    restart: always

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexo_password}
      POSTGRES_DB: ${POSTGRES_DB:-nexo_db}

    ports:
      - "5435:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

    networks:
      - nexo-network

volumes:
  pgdata:
    external: true
    name: nexo-db_pgdata

networks:
  nexo-network:
    external: true